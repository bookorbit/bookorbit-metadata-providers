[package]
name = "soundbooththeater-provider"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true