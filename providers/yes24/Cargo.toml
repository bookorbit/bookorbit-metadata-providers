[package]
name = "yes24-provider"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
# Size over speed: the service waits on the network, not the CPU.
opt-level = "z"
panic = "abort"
strip = true
